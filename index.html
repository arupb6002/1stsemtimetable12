<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Routine App</title>
  <meta name="description" content="Mobile-first Class Routine App for Golaghat Polytechnic, Furkating.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root" class="min-h-screen flex flex-col md:max-w-md md:mx-auto md:shadow-2xl relative bg-slate-50">
    <!-- Initial Loading State -->
    <div class="flex-1 flex items-center justify-center min-h-screen">
      <div class="animate-pulse flex flex-col items-center">
        <div class="w-16 h-16 bg-blue-200 rounded-full mb-4"></div>
        <div class="h-4 bg-slate-200 rounded w-32 mb-2"></div>
        <div class="h-3 bg-slate-200 rounded w-24"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>

</html>
